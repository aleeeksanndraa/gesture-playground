<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piece of Home · Board</title>
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <div class="void" aria-hidden="true"></div>
  <canvas id="gl"></canvas>
  <canvas id="hands"></canvas>

  <header class="title">
    <p class="label">Piece of Home</p>
    <h1 id="question"></h1>
  </header>

  <aside class="qr">
    <img id="qr" alt="QR code to add your piece" src="/api/qr.svg">
    <div>
      <b id="hint"></b>
      <span class="url" id="url"></span>
    </div>
  </aside>

  <div class="counter">
    <div class="big"><span id="count">0</span></div>
    <div class="label">pieces of home · <span id="layout"></span></div>
  </div>

  <nav class="gestures" id="gestures">
    <div class="card teal dim g" data-g="open">
      <div class="icon">✋</div>
      <div><b>Open hand</b><span>unfold the puzzle · move to tilt</span></div>
    </div>
    <div class="card amber dim g" data-g="fist">
      <div class="icon">✊</div>
      <div><b>Fist</b><span>roll it into a sphere · move to spin</span></div>
    </div>
    <div class="card pink dim g" data-g="zoom">
      <div class="icon">🙌</div>
      <div><b>Two hands</b><span>apart / together to zoom</span></div>
    </div>
    <p class="mouse">no camera? drag · scroll · L switch · F fullscreen</p>
  </nav>

  <div class="card cambubble" id="cambubble" hidden><video id="cam" playsinline muted></video></div>

  <div class="newpiece" id="newpiece">
    <canvas></canvas>
    <p class="card pink pill">A new piece of home</p>
  </div>

  <div class="card pill offline" id="offline" hidden>Reconnecting to the server…</div>
  <div class="debug" id="debug" hidden></div>

  <script type="module" src="js/board.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stories · Piece of Home</title>
  <link rel="stylesheet" href="css/house.css">
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="hands"></canvas>

  <header class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M5 14.5 16 5l11 9.5V27H5z" opacity=".45"/>
      <path d="M9 17.5h5.2a2.2 2.2 0 1 1 3.6 0H23V27H9z"/>
      <circle cx="25.5" cy="7" r="1.1" fill="currentColor" stroke="none"/><circle cx="28" cy="10.5" r=".7" fill="currentColor" stroke="none"/></g></svg>
    <span>stories</span>
  </header>

  <div class="count"><b id="count">0</b><span>pieces of home</span></div>

  <div class="pill view" id="view">Outside view</div>

  <nav class="guide" id="guide">
    <div class="chip" data-g="stir">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9c3-2 6 2 9 0s5-2 7-1"/><path d="M3 14c3-2 6 2 9 0s5-2 7-1"/><rect x="18" y="16" width="3" height="3" rx=".6" transform="rotate(20 19.5 17.5)"/><rect x="15" y="4" width="2.4" height="2.4" rx=".5" transform="rotate(-15 16 5)"/></g></svg>
      <span>Sweep an open hand to stir</span>
    </div>
    <div class="chip" data-g="step">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 20V9.5a4 4 0 0 1 8 0V20"/><path d="M3 20h18"/><path d="M12 17v-5m-2 2.5 2 2.5 2-2.5"/></g></svg>
      <span>Backs of hands together, spread to step in</span>
    </div>
    <div class="chip" data-g="point">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2.2"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l1.8 1.8M16.2 16.2 18 18M18 6l-1.8 1.8M7.8 16.2 6 18"/></g></svg>
      <span>Inside: aim your palm, close it on a photo</span>
    </div>
  </nav>

  <aside class="qr" id="qrbox">
    <img id="qr" alt="QR code to add your piece" src="/api/qr.svg">
    <b>Share a piece of your home</b>
    <span class="url" id="url"></span>
  </aside>

  <p class="caption" id="caption"></p>

  <div class="cam" id="cambubble" hidden><video id="cam" playsinline muted></video><span>Hand camera</span></div>

  <div class="focus" id="focus" hidden>
    <canvas width="512" height="512"></canvas>
    <p id="focusText"></p>
  </div>

  <div class="pill offline" id="offline" hidden>Reconnecting to the server…</div>
  <div class="debug" id="debug" hidden></div>

  <script type="module" src="js/house.js"></script>
</body>
</html>

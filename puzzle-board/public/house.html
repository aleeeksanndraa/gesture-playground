<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stories · Piece of Home</title>
  <link rel="stylesheet" href="css/house.css">
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="hands"></canvas>

  <header class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 18.5 20 6.5l14 12V34H6z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>
    <span>stories</span>
  </header>

  <div class="count"><b id="count">0</b><span>pieces of home</span></div>

  <div class="pill view" id="view">Outside view</div>

  <nav class="guide" id="guide">
    <div class="chip" data-g="grab">
      <svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4.5a3 3 0 0 1 6 0V21m0-3.5V16a3 3 0 0 1 6 0v5m0-3.5a3 3 0 0 1 6 0V24"/><path d="M33 22.5a3 3 0 0 1 5 2.2c0 7.3-4.7 13.8-12.6 13.8h-2.2C16.4 38.5 12 34 12 27.6V24a3 3 0 0 1 3-3h5.5a3 3 0 0 1 0 6H17"/><path d="M9 12l2.5 2.5M24 7v3.5M37 11l-2.5 2.5"/></g></svg>
      <span>Grab to turn</span>
    </div>
    <div class="chip" data-g="step">
      <svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 36c-4-2-6-6-6-10V16a2.5 2.5 0 0 1 5 0v6m0-9a2.5 2.5 0 0 1 5 0v9m0-7.5a2.5 2.5 0 0 1 5 0V27c0 5-2.5 9-6 10"/><path d="M34 36c4-2 6-6 6-10V16a2.5 2.5 0 0 0-5 0v6m0-9a2.5 2.5 0 0 0-5 0v9m0-7.5a2.5 2.5 0 0 0-5 0"/><path d="M5 8 2 11l3 3M43 8l3 3-3 3M3 11h7M38 11h7"/></g></svg>
      <span>Hands apart to step in</span>
    </div>
    <div class="chip" data-g="point">
      <svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 26V8.5a3 3 0 0 1 6 0V24m0-3a3 3 0 0 1 6 0v4m0-2a3 3 0 0 1 6 0v6c0 6-4 10.5-10 10.5h-3c-4 0-6.5-2-8.5-5L11 33a3 3 0 0 1 4.6-3.8L20 33"/><path d="M14 6l2 2.5M32 6l-2 2.5"/></g></svg>
      <span>Point to pick a spot</span>
    </div>
  </nav>

  <aside class="qr" id="qrbox">
    <img id="qr" alt="QR code to add your piece" src="/api/qr.svg">
    <b>Share a piece<br>of your home</b>
    <span class="url" id="url"></span>
  </aside>

  <p class="caption" id="caption"></p>

  <div class="cam" id="cambubble" hidden><video id="cam" playsinline muted></video><span>Hand camera</span></div>

  <div class="focus" id="focus" hidden>
    <canvas width="512" height="512"></canvas>
    <p id="focusText"></p>
  </div>

  <div class="pill offline" id="offline" hidden>Reconnecting to the server…</div>
  <div class="debug" id="debug" hidden></div>

  <script type="module" src="js/house.js"></script>
</body>
</html>

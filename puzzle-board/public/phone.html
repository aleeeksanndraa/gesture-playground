<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2a1620">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>stories · Piece of Home</title>
  <link rel="stylesheet" href="css/phone.css">
</head>
<body>
  <header class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M5 14.5 16 5l11 9.5V27H5z" opacity=".45"/>
      <path d="M9 17.5h5.2a2.2 2.2 0 1 1 3.6 0H23V27H9z"/>
      <circle cx="25.5" cy="7" r="1.1" fill="currentColor" stroke="none"/><circle cx="28" cy="10.5" r=".7" fill="currentColor" stroke="none"/></g></svg>
    <span>stories</span>
    <em class="tag" id="count"></em>
  </header>

  <main class="screen" id="pick">
    <p class="kicker" id="kicker">Piece of Home</p>
    <h1 id="question"></h1>
    <div class="piece-wrap"><canvas class="piece" id="piece" width="720" height="720"></canvas></div>
    <p class="hint" id="hint">A photo of something that feels like home</p>

    <section class="topics" id="topics" hidden>
      <p class="kicker" id="topicLabel">What is it?</p>
      <div class="chips" id="chips"></div>
    </section>

    <div class="actions">
      <label class="btn main" id="chooseBtn"><input type="file" accept="image/*" id="photoIn" hidden><span>Choose a photo</span></label>
      <button class="btn main" id="send" hidden>Send to the house</button>
      <label class="btn ghost" id="changeBtn" hidden><input type="file" accept="image/*" id="photoIn2" hidden><span>Another photo</span></label>
    </div>
  </main>

  <main class="screen" id="sent" hidden>
    <p class="kicker">Sent</p>
    <h1>Your piece is flying to the house</h1>
    <div class="piece-wrap"><canvas class="piece fly" id="sentPiece" width="720" height="720"></canvas></div>
    <p class="hint">Look at the screen: it lands like a falling star.</p>
    <div class="actions"><button class="btn ghost" id="again">Add another piece</button></div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/phone.js"></script>
</body>
</html>
